<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King999 - Official Gaming App</title>
    <style>
        :root { --primary: #e11d48; --bg: #0f172a; --card-bg: #1e293b; --text: #fff; --accent: #38bdf8; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .header { background: #020617; padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); }
        .header h1 { margin: 0; color: var(--primary); font-size: 24px; letter-spacing: 1px; }
        .container { max-width: 480px; margin: auto; padding: 15px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        input, select { background: #334155; color: #fff; }
        button { background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #be123c; }
        .hidden { display: none; }
        .balance-box { background: linear-gradient(135deg, #1e293b, #334155); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; border: 1px solid #475569; }
        .balance-box h2 { margin: 5px 0; color: #4ade80; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .game-card { background: #334155; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid #475569; transition: 0.2s; }
        .game-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .game-card img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .support-icons { display: flex; justify-content: space-around; margin-top: 15px; }
        .support-btn { padding: 10px 20px; border-radius: 8px; color: #fff; text-decoration: none; font-weight: bold; display: inline-block; font-size: 14px; text-align: center; width: 45%; }
        .tg { background: #229ed9; }
        .wa { background: #25d366; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KING999 👑</h1>
    </div>

    <div class="container">
        <!-- লোগইন ও সাইন আপ সেকশন -->
        <div class="card" id="auth-section">
            <h2 style="text-align: center; color: var(--accent);">লগইন / সাইন আপ</h2>
            <input type="text" id="username" placeholder="ইউজারনেম দিন">
            <input type="password" id="password" placeholder="পাসওয়ার্ড দিন">
            <button onclick="handleAuth()">এন্ট্রি করুন / রেজিস্টার</button>
        </div>

        <!-- মেইন ড্যাশবোর্ড সেকশন -->
        <div class="card hidden" id="dashboard-section">
            <h3>স্বাগতম, <span id="user-display" style="color: var(--accent);"></span></h3>
            
            <div class="balance-box">
                <p style="margin: 0; font-size: 14px; color: #94a3b8;">মূল ব্যালেন্স</p>
                <h2>৳ <span id="user-balance">0.00</span></h2>
            </div>

            <!-- ডিপোজিট ও উইথড্র সেকশন -->
            <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                <h4 style="margin: 0 0 10px 0; color: var(--accent);">💰 ডিপোজিট ও উইথড্র</h4>
                <p style="font-size: 12px; color: #cbd5e1; margin: 0 0 8px 0;">অ্যাডমিন নাম্বার: <b id="admin-bkash-num" style="color: #facc15;">01700000000 (বিকাশ/নগদ)</b></p>
                <input type="number" id="trx-amount" placeholder="টাকার পরিমাণ">
                <input type="text" id="trx-id" placeholder="ট্রানজেকশন আইডি (TrxID) বা নম্বর">
                <div style="display: flex; gap: 5px;">
                    <button onclick="sendRequest('Deposit')" style="background: #16a34a;">ডিপোজিট</button>
                    <button onclick="sendRequest('Withdraw')" style="background: #ca8a04;">উইথড্র</button>
                </div>
            </div>

            <!-- গেম ক্যাটাগরি ও লোগো -->
            <h4 style="margin: 10px 0; color: var(--accent);">🎮 জনপ্রিয় গেমসমূহ</h4>
            <div class="games-grid">
                <div class="game-card" onclick="playGame('Aviator')">
                    <div style="font-size: 28px;">✈️</div>
                    <strong>Aviator</strong>
                </div>
                <div class="game-card" onclick="playGame('Super Ace')">
                    <div style="font-size: 28px;">🃏</div>
                    <strong>Super Ace</strong>
                </div>
                <div class="game-card" onclick="playGame('Money Rush')">
                    <div style="font-size: 28px;">🔥</div>
                    <strong>Money Rush</strong>
                </div>
                <div class="game-card" onclick="playGame('Jili Slot')">
                    <div style="font-size: 28px;">🎰</div>
                    <strong>Jili Slot</strong>
                </div>
                <div class="game-card" onclick="playGame('Poker')">
                    <div style="font-size: 28px;">♠️</div>
                    <strong>Poker</strong>
                </div>
                <div class="game-card" onclick="playGame('PG Gaming')">
                    <div style="font-size: 28px;">🎯</div>
                    <strong>PG Gaming</strong>
                </div>
            </div>

            <!-- কাস্টমার সার্ভিস (টেলিগ্রাম ও হোয়াটসঅ্যাপ) -->
            <h4 style="margin: 15px 0 5px 0; color: var(--accent);">📞 গ্রাহক সেবা</h4>
            <div class="support-icons">
                <a href="https://t.me/yourusername" target="_blank" class="support-btn tg">টেলিগ্রাম</a>
                <a href="https://wa.me/8801700000000" target="_blank" class="support-btn wa">হোয়াটসঅ্যাপ</a>
            </div>

            <button onclick="handleLogout()" style="background: #ef4444; margin-top: 20px;">লগআউট</button>
        </div>
    </div>

    <script>
        // সাইন-আপ ও লগইন হ্যান্ডেল সিস্টেম
        function handleAuth() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if(!user || !pass) {
                alert('দয়া করে ইউজারনেম এবং পাসওয়ার্ড উভয়ই দিন!');
                return;
            }

            // লোকালস্টোরেজে ইউজার ডাটা চেক বা সেভ করা
            let savedUsers = JSON.parse(localStorage.getItem('king999_users') || '{}');

            if(savedUsers[user]) {
                if(savedUsers[user].password !== pass) {
                    alert('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিয়ে লগইন করুন।');
                    return;
                }
            } else {
                // নতুন একাউন্ট সাইন আপ
                savedUsers[user] = { password: pass, balance: 0 };
                localStorage.setItem('king999_users', JSON.stringify(savedUsers));
                alert('সফলভাবে সাইন-আপ সম্পন্ন হয়েছে!');
            }

            localStorage.setItem('king999_current_user', user);
            showDashboard();
        }

        function showDashboard() {
            const currentUser = localStorage.getItem('king999_current_user');
            if(currentUser) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-display').innerText = currentUser;
                
                let savedUsers = JSON.parse(localStorage.getItem('king999_users') || '{}');
                let userBal = savedUsers[currentUser] ? savedUsers[currentUser].balance : 0;
                document.getElementById('user-balance').innerText = parseFloat(userBal).toFixed(2);
            }
        }

        // ডিপোজিট ও উইথড্র রিকোয়েস্ট এডমিন প্যানেলে পাঠানো
        function sendRequest(type) {
            const amount = document.getElementById('trx-amount').value;
            const trxId = document.getElementById('trx-id').value;
            const currentUser = localStorage.getItem('king999_current_user');

            if(!amount || !trxId) {
                alert('পরিমাণ এবং ট্রানজেকশন আইডি/নম্বর দিন!');
                return;
            }

            let requests = JSON.parse(localStorage.getItem('deposit_requests') || '[]');
            requests.push({ user: currentUser, type: type, amount: amount, trx: trxId, status: 'Pending' });
            localStorage.setItem('deposit_requests', JSON.stringify(requests));

            alert(type + ' রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে। এডমিন চেক করে অনুমোদন দিলে ব্যালেন্স আপডেট হবে।');
            document.getElementById('trx-amount').value = '';
            document.getElementById('trx-id').value = '';
        }

        // গেম রান লজিক (৩০% উইন এবং ৭০% লস রেট কন্ট্রোল)
        function playGame(gameName) {
            let currentUser = localStorage.getItem('king999_current_user');
            let savedUsers = JSON.parse(localStorage.getItem('king999_users') || '{}');
            let currentBal = savedUsers[currentUser].balance;

            if(currentBal <= 0) {
                alert('আপনার পর্যাপ্ত ব্যালেন্স নেই! প্রথমে ডিপোজিট করুন।');
                return;
            }

            let betAmount = prompt(gameName + '-এ কত টাকা বাজি ধরতে চান? (আপনার ব্যালেন্স: ৳ ' + currentBal + ')');
            betAmount = parseFloat(betAmount);

            if(isNaN(betAmount) || betAmount <= 0 || betAmount > currentBal) {
                alert('সঠিক বাজি ধরার পরিমাণ লিখুন!');
                return;
            }

            // ৩০% উইন এবং ৭০% লস লজিক (র‍্যান্ডম নাম্বার ১ থেকে ১০০)
            let randomChance = Math.floor(Math.random() * 100) + 1;
            
            if(randomChance <= 30) {
                // উইন (দ্বিগুণ রিটার্ন)
                let winAmount = betAmount * 2;
                savedUsers[currentUser].balance += (winAmount - betAmount);
                alert('অভিনন্দন! আপনি জিতেছেন 🎉 +৳ ' + (winAmount - betAmount));
            } else {
                // লস (ব্যালেন্স কেটে নেওয়া)
                savedUsers[currentUser].balance -= betAmount;
                alert('দুঃখিত, আপনি হেরে গেছেন ❌ -৳ ' + betAmount);
            }

            localStorage.setItem('king999_users', JSON.stringify(savedUsers));
            showDashboard();
        }

        function handleLogout() {
            localStorage.removeItem('king999_current_user');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }

        window.onload = function() {
            if(localStorage.getItem('king999_current_user')) {
                showDashboard();
            }
        }
    </script>
</body>
</html>
